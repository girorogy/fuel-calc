<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#03100d">
  <title>JET-A1 燃油估算系統</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* 宣告本地離線字型檔案（JetBrainsMono.woff2），確保完全斷網也能 100% 呈現斜線 0 */
    @font-face {
      font-family: 'JetBrains Mono Local';
      src: url('./JetBrainsMono.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* 配色方案 */
      --eva-green: #008738;
      --eva-green-dark: #004d20;
      --eva-green-light: #00a844;
      --eva-green-numeric: #00ff88;
      --eva-orange: #fe3501;
      
      --bg-dark: #03100d;
      --card-bg: #0b1e15;
      --card-border: #143828;
      --input-bg: #05150e;
      --text-main: #e6f4f0;
      --text-sub: #7fa895;
      --error-color: #fe3501;
      --success-color: #008738;
      
      /* 優先使用本地離線工程字型 */
      --font-mono: 'JetBrains Mono Local', 'JetBrains Mono', Consolas, Monaco, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--eva-green-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group p {
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .flight-clock-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .clock-date, .clock-time {
      font-family: var(--font-mono);
      font-feature-settings: "zero" 1;
      -webkit-font-feature-settings: "zero" 1;
      color: var(--eva-green-light);
      font-weight: 600;
    }

    .status-badge {
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .status-success { 
      background: rgba(0, 135, 56, 0.15); 
      color: var(--eva-green-light); 
      border: 1px solid var(--eva-green-light); 
    }
    .status-warning {
      background: rgba(254, 53, 1, 0.15);
      color: var(--eva-orange);
      border: 1px solid var(--eva-orange);
    }

    .mode-selector {
      display: flex;
      background-color: var(--input-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      color: var(--eva-green-light);
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn.active {
      background-color: var(--eva-green);
      color: var(--eva-green-numeric);
      box-shadow: 0 2px 10px rgba(0, 135, 56, 0.4);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .label-row label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--eva-green-light);
    }

    .label-row .tag {
      font-size: 0.7rem;
      color: var(--text-sub);
    }

    /* 雙層覆蓋輸入框容器 */
    .overlay-input-wrapper {
      position: relative;
      width: 100%;
      height: 48px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .overlay-input-wrapper:focus-within {
      border-color: var(--eva-green-numeric);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
    }

    .overlay-input-wrapper input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: transparent !important;
      caret-color: var(--eva-green-numeric);
      font-family: var(--font-mono) !important;
      font-feature-settings: "zero" 1 !important;
      -webkit-font-feature-settings: "zero" 1 !important;
      font-size: 1.1rem !important;
      font-weight: 600 !important;
      padding: 0 14px;
      -webkit-appearance: none;
      z-index: 2;
    }

    .overlay-input-display {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-family: var(--font-mono) !important;
      font-feature-settings: "zero" 1 !important;
      -webkit-font-feature-settings: "zero" 1 !important;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--eva-green-light);
      pointer-events: none;
      z-index: 1;
    }

    .overlay-input-display .placeholder {
      color: var(--text-sub);
      font-weight: 400;
    }

    .input-hint {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .result-card {
      background: linear-gradient(135deg, #004d20 0%, #03150d 100%);
      border: 1px solid var(--eva-green);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .result-title {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--eva-green-light);
      margin-bottom: 8px;
    }

    .result-value {
      font-size: 2.2rem;
      font-weight: 800;
      font-family: var(--font-mono);
      font-feature-settings: "zero" 1;
      -webkit-font-feature-settings: "zero" 1;
      color: var(--eva-green-numeric);
      margin: 8px 0;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
    }

    .result-value span {
      font-size: 1rem;
      font-weight: 400;
      margin-left: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .result-detail {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .detail-row span:last-child {
      color: #fff;
      font-weight: 600;
      font-family: var(--font-mono);
      font-feature-settings: "zero" 1;
      -webkit-font-feature-settings: "zero" 1;
      letter-spacing: 0.5px;
    }

    .detail-row #res-refuel-time {
      color: var(--eva-orange) !important;
      font-weight: 700 !important;
      font-family: var(--font-mono);
      font-feature-settings: "zero" 1;
      -webkit-font-feature-settings: "zero" 1;
      letter-spacing: 0.5px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-sub);
      opacity: 0.6;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="title-group">
      <h1>✈️ 燃油估算系統</h1>
      <p>JET-A1 FUEL CALCULATION SYSTEM</p>
    </div>
    <button class="btn-reset" onclick="resetForm()">↺ 重置</button>
  </div>

  <div class="flight-clock-bar">
    <span class="clock-date" id="live-date">-- --- (--) ----</span>
    <span class="clock-time" id="live-time">--:--</span>
  </div>

  <!-- 狀態列：將根據 Service Worker 驗證結果動態切換 -->
  <div id="offline-status" class="status-badge status-warning">🟡 離線模組檢測中...</div>

  <div class="mode-selector">
    <button class="mode-btn active" id="btn-kg" onclick="switchMode('KG')">一般面板 (KG)</button>
    <button class="mode-btn" id="btn-b737" onclick="switchMode('B737')">737 專用</button>
    <button class="mode-btn" id="btn-ups" onclick="switchMode('UPS')">UPS (LBS)</button>
  </div>

  <div id="form-container"></div>

  <div class="result-card">
    <div class="result-title" id="res-main-title">ESTIMATED FUEL TO LIFT 預估所需加油量</div>
    <div class="result-value" id="res-liters">-- <span>L</span></div>
    <div id="res-status-msg" style="font-size: 0.8rem; color: var(--text-sub);">請填寫數值進行計算</div>
    
    <div class="result-detail">
      <div class="detail-row">
        <span>最終目標總重：</span>
        <span id="res-target-total">--</span>
      </div>
      <div class="detail-row">
        <span>實際需加重量：</span>
        <span id="res-diff-weight">--</span>
      </div>
      <div class="detail-row" id="time-row" style="display:none;">
        <span>預估加油時間：</span>
        <span id="res-refuel-time">--</span>
      </div>
    </div>
  </div>

  <div class="footer">⚡ Offline Ready (Standalone)</div>
</div>

<script>
  let currentMode = 'KG';

  let kgData = { target: '', extra: '', current: '', sg: '0.780', flow: '' };
  let b737Data = { target: '' };
  let upsData = { planned: '', remaining: '', factor: '0.5', flow: '' };

  // 時鐘更新
  function updateClock() {
    const now = new Date();
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    
    const day = String(now.getDate()).padStart(2, '0');
    const monthNum = String(now.getMonth() + 1).padStart(2, '0');
    const monthStr = months[now.getMonth()];
    const year = now.getFullYear();
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    document.getElementById('live-date').textContent = `${day} ${monthStr} (${monthNum}) ${year}`;
    document.getElementById('live-time').textContent = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 註冊 Service Worker 並即時驗證離線狀態
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service Worker 註冊成功:', reg.scope);
          const statusEl = document.getElementById('offline-status');
          if (statusEl) {
            statusEl.textContent = '🟢 離線準備就緒';
            statusEl.className = 'status-badge status-success';
          }
        })
        .catch((err) => {
          console.log('Service Worker 註冊失敗:', err);
          const statusEl = document.getElementById('offline-status');
          if (statusEl) {
            statusEl.textContent = '🟡 離線快取建立失敗';
            statusEl.className = 'status-badge status-warning';
          }
        });
    });
  } else {
    const statusEl = document.getElementById('offline-status');
    if (statusEl) {
      statusEl.textContent = '🔴 瀏覽器不支援 PWA 離線';
      statusEl.className = 'status-badge status-warning';
    }
  }

  function syncDisplay(fieldKey) {
    const inputEl = document.getElementById(`input-${fieldKey}`);
    const displayEl = document.getElementById(`disp-${fieldKey}`);
    if (!inputEl || !displayEl) return;

    let val = inputEl.value;
    if (currentMode === 'KG') {
      kgData[fieldKey] = val;
    } else if (currentMode === 'B737') {
      b737Data[fieldKey] = val;
    } else {
      upsData[fieldKey] = val;
    }

    if (val !== '') {
      displayEl.innerHTML = val;
    } else {
      let placeholderText = '';
      if (fieldKey === 'target' && currentMode === 'KG') placeholderText = '例如: 123.2';
      else if (fieldKey === 'target' && currentMode === 'B737') placeholderText = '例如: 10.8 (代表十噸八)';
      else if (fieldKey === 'extra') placeholderText = '例如: 2 (代表多加 200kg)';
      else if (fieldKey === 'current') placeholderText = '例如: 10.2';
      else if (fieldKey === 'sg') placeholderText = '預設 0.780';
      else if (fieldKey === 'planned') placeholderText = '例如: 50000';
      else if (fieldKey === 'remaining') placeholderText = '例如: 12000';
      else if (fieldKey === 'factor') placeholderText = '預設 0.5';
      else if (fieldKey === 'flow') placeholderText = '例如: 800 (選填)';
      displayEl.innerHTML = `<span class="placeholder">${placeholderText}</span>`;
    }

    calculate();
  }

  function renderForm() {
    const container = document.getElementById('form-container');
    if (currentMode === 'KG') {
      container.innerHTML = `
        <div class="input-group">
          <div class="label-row">
            <label>🔵 目標油量 (面板讀數)</label>
            <span class="tag">LOAD SELECT QTY</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-target" type="number" inputmode="decimal" step="any" value="${kgData.target}" oninput="syncDisplay('target')">
            <div id="disp-target" class="overlay-input-display">
              ${kgData.target !== '' ? kgData.target : '<span class="placeholder">例如: 123.2</span>'}
            </div>
          </div>
          <div class="input-hint">面板 QTY X1000（輸入 123.2 = 123,200 kg）</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>🟢 額外多加 (0~9)</label>
            <span class="tag">EXTRA FUEL</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-extra" type="number" inputmode="numeric" step="1" value="${kgData.extra}" oninput="syncDisplay('extra')">
            <div id="disp-extra" class="overlay-input-display">
              ${kgData.extra !== '' ? kgData.extra : '<span class="placeholder">例如: 2 (代表多加 200kg)</span>'}
            </div>
          </div>
          <div class="input-hint">選填，僅限 0~9 整數（1=100kg, 2=200kg）</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>🟡 剩餘油量 (面板讀數)</label>
            <span class="tag">FUEL QTY</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-current" type="number" inputmode="decimal" step="any" value="${kgData.current}" oninput="syncDisplay('current')">
            <div id="disp-current" class="overlay-input-display">
              ${kgData.current !== '' ? kgData.current : '<span class="placeholder">例如: 10.2</span>'}
            </div>
          </div>
          <div class="input-hint">面板 QTY X1000（輸入 10.2 = 10,200 kg）</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>🟣 燃油比重 (SG)</label>
            <span class="tag">SPECIFIC GRAVITY</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-sg" type="number" inputmode="decimal" step="any" value="${kgData.sg}" oninput="syncDisplay('sg')">
            <div id="disp-sg" class="overlay-input-display">
              ${kgData.sg !== '' ? kgData.sg : '<span class="placeholder">預設 0.780</span>'}
            </div>
          </div>
          <div class="input-hint">預設 0.780（必須大於 0）</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>⏱️ 每分鐘流速 (L/min)</label>
            <span class="tag">FLOW RATE</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-flow" type="number" inputmode="numeric" step="any" value="${kgData.flow}" oninput="syncDisplay('flow')">
            <div id="disp-flow" class="overlay-input-display">
              ${kgData.flow !== '' ? kgData.flow : '<span class="placeholder">例如: 800 (選填)</span>'}
            </div>
          </div>
          <div class="input-hint">選填，填入後可自動預估加油時間</div>
        </div>
      `;
    } else if (currentMode === 'B737') {
      container.innerHTML = `
        <div class="input-group">
          <div class="label-row">
            <label>✈️ 波音737 目標總油量</label>
            <span class="tag">B737 TARGET</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-target" type="number" inputmode="decimal" step="any" value="${b737Data.target}" oninput="syncDisplay('target')">
            <div id="disp-target" class="overlay-input-display">
              ${b737Data.target !== '' ? b737Data.target : '<span class="placeholder">例如: 10.8 (代表十噸八)</span>'}
            </div>
          </div>
          <div class="input-hint">輸入 10.8 或 10800，自動扣除左右主油箱 7,600 KG</div>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="input-group">
          <div class="label-row">
            <label>🔵 計劃加總油量 (Planned Lbs)</label>
            <span class="tag">PLANNED LBS</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-planned" type="number" inputmode="numeric" step="any" value="${upsData.planned}" oninput="syncDisplay('planned')">
            <div id="disp-planned" class="overlay-input-display">
              ${upsData.planned !== '' ? upsData.planned : '<span class="placeholder">例如: 50000</span>'}
            </div>
          </div>
          <div class="input-hint">對應 UPS 表單 Planned Lbs 總數</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>🟡 剩餘油量 (Remaining Lbs)</label>
            <span class="tag">REMAINING LBS</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-remaining" type="number" inputmode="numeric" step="any" value="${upsData.remaining}" oninput="syncDisplay('remaining')">
            <div id="disp-remaining" class="overlay-input-display">
              ${upsData.remaining !== '' ? upsData.remaining : '<span class="placeholder">例如: 12000</span>'}
            </div>
          </div>
          <div class="input-hint">對應 UPS 表單 Remaining Lbs 總數</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>🟣 換算比例 (Conversion)</label>
            <span class="tag">CONVERSION</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-factor" type="number" inputmode="decimal" step="any" value="${upsData.factor}" oninput="syncDisplay('factor')">
            <div id="disp-factor" class="overlay-input-display">
              ${upsData.factor !== '' ? upsData.factor : '<span class="placeholder">預設 0.5</span>'}
            </div>
          </div>
          <div class="input-hint">預設 0.5（即 10 磅 = 5 公升，必須大於 0）</div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>⏱️ 每分鐘流速 (L/min)</label>
            <span class="tag">FLOW RATE</span>
          </div>
          <div class="overlay-input-wrapper">
            <input id="input-flow" type="number" inputmode="numeric" step="any" value="${upsData.flow}" oninput="syncDisplay('flow')">
            <div id="disp-flow" class="overlay-input-display">
              ${upsData.flow !== '' ? upsData.flow : '<span class="placeholder">例如: 800 (選填)</span>'}
            </div>
          </div>
          <div class="input-hint">選填，填入後可自動預估加油時間</div>
        </div>
      `;
    }
    calculate();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btn-kg').classList.toggle('active', mode === 'KG');
    document.getElementById('btn-b737').classList.toggle('active', mode === 'B737');
    document.getElementById('btn-ups').classList.toggle('active', mode === 'UPS');
    renderForm();
  }

  function calculate() {
    let liters = 0;
    let flowRate = 0;

    if (currentMode === 'KG') {
      document.getElementById('res-main-title').textContent = 'ESTIMATED FUEL TO LIFT 預估所需加油量';
      
      const target = parseFloat(kgData.target);
      const extra = kgData.extra === '' ? 0 : parseFloat(kgData.extra);
      const current = parseFloat(kgData.current);
      const sg = parseFloat(kgData.sg);
      flowRate = parseFloat(kgData.flow);

      if (kgData.target === '' || kgData.current === '') {
        resetResults();
        const statusEl = document.getElementById('res-status-msg');
        statusEl.style.color = 'var(--error-color)';
        if (kgData.target === '') {
          statusEl.textContent = '請輸入目標油量';
        } else {
          statusEl.textContent = '請輸入剩餘油量';
        }
        return;
      }

      if (
        !Number.isFinite(target) ||
        !Number.isFinite(current) ||
        !Number.isFinite(sg) ||
        sg <= 0
      ) {
        showError("請輸入有效的油量及正數比重 (SG)");
        return;
      }

      if (target < 0 || current < 0) {
        showError("油量數值不可為負數");
        return;
      }

      if (
        !Number.isFinite(extra) ||
        !Number.isInteger(extra) ||
        extra < 0 ||
        extra > 9
      ) {
        showError("額外多加必須是 0~9 的整數");
        return;
      }

      const targetTotalKg = (target * 1000) + (extra * 100);
      const currentTotalKg = current * 1000;
      const diffKg = targetTotalKg - currentTotalKg;

      if (diffKg < 0) {
        showError("剩餘油量已超過目標油量");
        return;
      }

      liters = Math.round(diffKg / sg);

      document.getElementById('res-liters').innerHTML = `${liters.toLocaleString()} <span>L</span>`;
      document.getElementById('res-target-total').textContent = `${targetTotalKg.toLocaleString()} KG`;
      document.getElementById('res-diff-weight').textContent = `${diffKg.toLocaleString()} KG`;
      document.getElementById('res-status-msg').textContent = "🟢 計算成功";
      document.getElementById('res-status-msg').style.color = "var(--eva-green-light)";

    } else if (currentMode === 'B737') {
      document.getElementById('res-main-title').textContent = 'B737 CENTER TANK TARGET 中央油箱應加';

      const targetVal = parseFloat(b737Data.target);

      if (b737Data.target === '') {
        resetResults();
        document.getElementById('res-status-msg').textContent = '請輸入 737 目標總油量';
        document.getElementById('res-status-msg').style.color = 'var(--error-color)';
        return;
      }

      if (!Number.isFinite(targetVal) || targetVal < 0) {
        showError("請輸入有效的目標總油量");
        return;
      }

      let totalKg = targetVal < 100 ? targetVal * 1000 : targetVal;
      const mainTanksKg = 7600; 
      let centerKg = totalKg - mainTanksKg;
      if (centerKg < 0) centerKg = 0;

      document.getElementById('res-liters').innerHTML = `${centerKg.toLocaleString()} <span>KG</span>`;
      document.getElementById('res-target-total').textContent = `${totalKg.toLocaleString()} KG`;
      document.getElementById('res-diff-weight').textContent = `${centerKg.toLocaleString()} KG`;
      document.getElementById('res-status-msg').textContent = "🟢 737 計算成功";
      document.getElementById('res-status-msg').style.color = "var(--eva-green-light)";
      
      document.getElementById('time-row').style.display = 'none';
      return;

    } else {
      document.getElementById('res-main-title').textContent = 'ESTIMATED FUEL TO LIFT 預估所需加油量';

      const planned = parseFloat(upsData.planned);
      const remaining = parseFloat(upsData.remaining);
      const factor = parseFloat(upsData.factor);
      flowRate = parseFloat(upsData.flow);

      if (upsData.planned === '' || upsData.remaining === '') {
        resetResults();
        const statusEl = document.getElementById('res-status-msg');
        statusEl.style.color = 'var(--error-color)';
        if (upsData.planned === '') {
          statusEl.textContent = '請輸入計劃加總油量';
        } else {
          statusEl.textContent = '請輸入剩餘油量';
        }
        return;
      }

      if (
        !Number.isFinite(planned) ||
        !Number.isFinite(remaining) ||
        !Number.isFinite(factor) ||
        factor <= 0
      ) {
        showError("請輸入有效的油量及正數換算比例");
        return;
      }

      if (planned < 0 || remaining < 0) {
        showError("油量數值不可為負數");
        return;
      }

      const diffLbs = planned - remaining;
      if (diffLbs < 0) {
        showError("剩餘油量已超過計劃油量");
        return;
      }

      liters = Math.round(diffLbs * factor);

      document.getElementById('res-liters').innerHTML = `${liters.toLocaleString()} <span>L</span>`;
      document.getElementById('res-target-total').textContent = `${planned.toLocaleString()} LBS`;
      document.getElementById('res-diff-weight').textContent = `${diffLbs.toLocaleString()} LBS`;
      document.getElementById('res-status-msg').textContent = "🟢 計算成功";
      document.getElementById('res-status-msg').style.color = "var(--eva-green-light)";
    }

    if (Number.isFinite(flowRate) && flowRate < 0) {
      showError("每分鐘流速不可為負數");
      return;
    }

    const timeRow = document.getElementById('time-row');
    if (!isNaN(flowRate) && flowRate > 0 && liters > 0) {
      const totalSeconds = Math.round((liters / flowRate) * 60);
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      let timeStr = '';
      if (hrs > 0) timeStr += `${hrs} hr `;
      if (mins > 0 || hrs > 0) timeStr += `${mins} min `;
      timeStr += `${secs} sec`;

      document.getElementById('res-refuel-time').textContent = timeStr;
      timeRow.style.display = 'flex';
    } else {
      timeRow.style.display = 'none';
    }
  }

  function resetResults() {
    document.getElementById('res-liters').innerHTML = `-- <span>L</span>`;
    document.getElementById('res-target-total').textContent = `--`;
    document.getElementById('res-diff-weight').textContent = `--`;
    document.getElementById('res-status-msg').textContent = "請完成填寫";
    document.getElementById('res-status-msg').style.color = "var(--text-sub)";
    document.getElementById('time-row').style.display = 'none';
  }

  function showError(msg) {
    document.getElementById('res-liters').innerHTML = `-- <span>L</span>`;
    document.getElementById('res-target-total').textContent = `--`;
    document.getElementById('res-diff-weight').textContent = `--`;
    document.getElementById('res-status-msg').textContent = msg;
    document.getElementById('res-status-msg').style.color = "var(--error-color)";
    document.getElementById('time-row').style.display = 'none';
  }

  function resetForm() {
    if (currentMode === 'KG') {
      kgData = { target: '', extra: '', current: '', sg: '0.780', flow: '' };
    } else if (currentMode === 'B737') {
      b737Data = { target: '' };
    } else if (currentMode === 'UPS') {
      upsData = { planned: '', remaining: '', factor: '0.5', flow: '' };
    }
    renderForm();
    resetResults();
  }

  renderForm();
</script>
</body>
</html>
